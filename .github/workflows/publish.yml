name: Fetch photos and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_none:
        description: "Try again for ideas that had no photo"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Fetch missing photos from Wikipedia
        run: python tools/fetch_photos.py ${{ inputs.retry_none && '--retry-none' || '' }}

      - name: Save new photos to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          if git diff --cached --quiet; then
            echo "No new photos"
          else
            git commit -m "Add photos from Wikipedia"
            git pull --rebase
            git push
          fi

      - name: Build the app
        run: python tools/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
